<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" role="img">
  <rect width="740" height="380" rx="24" fill="#fff9fb"/>
  <style>
    text{font:13.5px Arial,sans-serif;fill:#4d3347}
    .title{font:bold 19px Arial,sans-serif;fill:#3b2336}
    .minor{font-size:12px;fill:#7d6677}
    .line{stroke:#86546e;stroke-width:1.8;fill:none}
  </style>
  <text x="24" y="35" class="title">Blick durch das Spekulum auf die Portio während der Menstruation</text>

  <!-- Speculum Frontal Ring / View -->
  <circle cx="175" cy="190" r="115" fill="#f7d6e4" stroke="#b37490" stroke-width="3"/>
  <path d="M85 122 Q175 82 265 122 L248 148 Q175 122 102 148 Z" fill="#dce6ec" stroke="#5c6b73" stroke-width="2"/>
  <path d="M85 258 Q175 298 265 258 L248 232 Q175 258 102 232 Z" fill="#dce6ec" stroke="#5c6b73" stroke-width="2"/>

  <!-- Portio vaginalis cervicis -->
  <circle cx="175" cy="190" r="56" fill="#edaec5" stroke="#9e5876" stroke-width="2.5"/>
  <circle cx="175" cy="190" r="21" fill="#dc7595" opacity="0.55"/>
  <ellipse cx="175" cy="190" rx="12" ry="7" fill="#7a1632"/>
  <!-- Menstrual blood trickle -->
  <path d="M175 195 Q178 220 170 242 Q176 248 186 242 Q183 217 180 195 Z" fill="#b81d41" opacity="0.9"/>
  <ellipse cx="176" cy="244" rx="26" ry="8" fill="#a31839" opacity="0.85"/>

  <!-- Callout lines and labels with plenty of horizontal room -->
  <path d="M175 108 L315 82 L340 82" class="line"/>
  <text x="348" y="87"><tspan font-weight="bold">Oberes Spekulumblatt</tspan> (im vorderen Scheidengewölbe)</text>

  <path d="M218 160 L315 132 L340 132" class="line"/>
  <text x="348" y="137"><tspan font-weight="bold">Portio vaginalis</tspan> (glattes, rosafarbenes Plattenepithel)</text>

  <path d="M186 190 L315 184 L340 184" class="line"/>
  <text x="348" y="189"><tspan font-weight="bold">Äußerer Muttermund</tspan> (während Periode 1–3 mm geöffnet)</text>

  <path d="M184 226 L315 236 L340 236" class="line"/>
  <text x="348" y="241"><tspan font-weight="bold">Menstruationsblut &amp; Gewebe</tspan> (Abfluss aus Zervikalkanal)</text>

  <path d="M200 248 L315 286 L340 286" class="line"/>
  <text x="348" y="291"><tspan font-weight="bold">Hinteres Scheidengewölbe</tspan> (Blutsee in unterer Rinne)</text>

  <text x="24" y="348" class="minor">Praxistipp: Vor der Beurteilung das angesammelte Blut im hinteren Scheidengewölbe sanft mit einer Stielkompresse / Kornzange abtupfen.</text>
</svg>