<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" role="img">
  <rect width="740" height="400" rx="24" fill="#fff9fb"/>
  <style>
    text{font:12.5px Arial,sans-serif;fill:#4d3347}
    .title{font:bold 18.5px Arial,sans-serif;fill:#3b2336}
    .sub{font:bold 14px Arial,sans-serif;fill:#7a3e5d}
    .minor{font-size:11.5px;fill:#7d6677}
    .tissue{fill:#f3c6d8;stroke:#a96983;stroke-width:2}
    .finger{fill:#fcebe6;stroke:#c29b93;stroke-width:2}
    .uterus{fill:#eab0c5;stroke:#94516d;stroke-width:2.2}
    .line{stroke:#86546e;stroke-width:1.8;fill:none}
  </style>
  <text x="24" y="34" class="title">Hebammenkunde: Vaginale Tastuntersuchung (VU) &amp; Palpation</text>

  <!-- Panel 1: Lagerung & Intimsphäre -->
  <rect x="20" y="52" width="220" height="305" rx="14" fill="#fff2f7" stroke="#e2c6d5" stroke-width="1.5"/>
  <text x="32" y="76" class="sub">1. Lagerung &amp; Intimsphäre</text>
  <!-- Schematic bed with pelvic tilt & drape -->
  <line x1="35" y1="180" x2="225" y2="180" stroke="#86546e" stroke-width="2.5"/>
  <rect x="100" y="166" width="55" height="14" rx="7" fill="#d98cb3" stroke="#86546e" stroke-width="1.2"/>
  <path d="M45 165 Q85 165 118 160 Q145 156 160 162 L185 120 L215 172" fill="none" stroke="#6d3b56" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Drape sheet -->
  <path d="M75 150 Q120 135 155 155 L165 175" fill="none" stroke="#6ba894" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="32" y="210" font-weight="bold">Ausziehen &amp; Abdecken:</text>
  <text x="32" y="228" class="minor">• Nur unten freimachen</text>
  <text x="32" y="244" class="minor">• T-Shirt/Pullover bleibt an</text>
  <text x="32" y="260" class="minor">• Tuch über Oberschenkel</text>
  <text x="32" y="282" font-weight="bold">Lagerung:</text>
  <text x="32" y="300" class="minor">• Beine locker angewinkelt</text>
  <text x="32" y="316" class="minor">• Beckenkissen entlastet</text>
  <text x="32" y="332" class="minor">• Vorher Blase entleeren</text>

  <!-- Panel 2: Bi-manuelle Palpationstechnik -->
  <rect x="260" y="52" width="220" height="305" rx="14" fill="#fff2f7" stroke="#e2c6d5" stroke-width="1.5"/>
  <text x="272" y="76" class="sub">2. Bi-manuelle Tastung</text>
  <!-- Sagittal section -->
  <path d="M280 185 Q335 170 380 150 L390 185 Q340 205 280 220 Z" class="tissue"/>
  <circle cx="390" cy="165" r="22" class="uterus"/>
  <!-- Vaginal fingers (2 fingers: Zeige- + Mittelfinger) -->
  <path d="M270 208 L365 172 L368 180 L273 216 Z" class="finger"/>
  <path d="M273 217 L368 181 L371 189 L276 225 Z" class="finger"/>
  <!-- Outer hand on abdomen (Fundus tasten) -->
  <path d="M360 115 Q395 110 425 125" fill="none" stroke="#c29b93" stroke-width="5" stroke-linecap="round"/>
  <text x="272" y="245" font-weight="bold">Technik der 2 Hände:</text>
  <text x="272" y="263" class="minor">• <tspan font-weight="bold">Innere Hand:</tspan> Zeige- &amp;</text>
  <text x="272" y="279" class="minor">  Mittelfinger (dorsal geführt)</text>
  <text x="272" y="297" class="minor">• <tspan font-weight="bold">Äußere Hand:</tspan> Bauchwand</text>
  <text x="272" y="313" class="minor">  fixiert Fundus uteri</text>
  <text x="272" y="331" class="minor">• Organe dazwischen tasten</text>

  <!-- Panel 3: 4 Kriterien nach Bishop-Score -->
  <rect x="500" y="52" width="220" height="305" rx="14" fill="#fff2f7" stroke="#e2c6d5" stroke-width="1.5"/>
  <text x="512" y="76" class="sub">3. Die 4 Tast-Kriterien</text>
  <rect x="512" y="92" width="196" height="48" rx="8" fill="#fff" stroke="#d9a7b8"/>
  <text x="520" y="111" font-weight="bold">1. Konsistenz (Härte):</text>
  <text x="520" y="127" class="minor">Hart (Nase) → Weich (Lippen)</text>

  <rect x="512" y="146" width="196" height="48" rx="8" fill="#fff" stroke="#d9a7b8"/>
  <text x="520" y="165" font-weight="bold">2. Position / Ausrichtung:</text>
  <text x="520" y="181" class="minor">Sakral (hinten) → Zentriert</text>

  <rect x="512" y="200" width="196" height="48" rx="8" fill="#fff" stroke="#d9a7b8"/>
  <text x="520" y="219" font-weight="bold">3. Portiolänge / Verkürzung:</text>
  <text x="520" y="235" class="minor">Stehend (2–3 cm) → Verstrichen</text>

  <rect x="512" y="254" width="196" height="48" rx="8" fill="#fff" stroke="#d9a7b8"/>
  <text x="520" y="273" font-weight="bold">4. Muttermundsweite:</text>
  <text x="520" y="289" class="minor">Geschlossen → 1–10 cm (Geburt)</text>

  <text x="24" y="375" class="minor">Hebammen-Regel: Bei V.a. vorzeitigen Blasensprung oder Blutung in der Schwangerschaft KEINE digitale Tastung (Infektionsgefahr / Plazentalage)!</text>
</svg>