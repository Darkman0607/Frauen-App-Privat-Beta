<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" role="img">
  <rect width="740" height="400" rx="24" fill="#fff9fb"/>
  <style>
    text{font:12.5px Arial,sans-serif;fill:#4d3347}
    .title{font:bold 18.5px Arial,sans-serif;fill:#3b2336}
    .sub{font:bold 14px Arial,sans-serif;fill:#7a3e5d}
    .minor{font-size:11.5px;fill:#7d6677}
    .tissue{fill:#f5c4d6;stroke:#9e4f71;stroke-width:2}
    .muscle{fill:#e8a2bd;stroke:#803554;stroke-width:2.2}
    .vessel{stroke:#c9183b;stroke-width:2.5;fill:none}
    .blood{fill:#9e132f}
    .line{stroke:#86546e;stroke-width:1.5;fill:none}
  </style>
  <text x="24" y="34" class="title">Gynäkologie: Endometrium-Abstoßung (Desquamation) &amp; Spiralarterien</text>

  <!-- Panel 1: Gewebeschichten der Gebärmutterwand -->
  <rect x="20" y="52" width="345" height="295" rx="16" fill="#fff2f7" stroke="#e2c6d5" stroke-width="1.5"/>
  <text x="34" y="78" class="sub">1. Uteruswand im Schnitt (Histologie)</text>

  <!-- Layers: Myometrium, Basalis, Functionalis -->
  <!-- Myometrium -->
  <rect x="36" y="94" width="313" height="52" rx="8" class="muscle"/>
  <text x="46" y="125" font-weight="bold" fill="#541b32">Myometrium (glatte Muskulatur / Wehen)</text>

  <!-- Stratum basale -->
  <rect x="36" y="152" width="313" height="44" rx="8" fill="#f0b6cb" stroke="#9e4f71" stroke-width="1.8"/>
  <text x="46" y="179" font-weight="bold" fill="#63253d">Stratum basale (Regenerationsschicht)</text>

  <!-- Stratum functionale (wird abgestoßen) -->
  <rect x="36" y="202" width="313" height="72" rx="8" class="tissue"/>
  <text x="46" y="224" font-weight="bold" fill="#7a2a4c">Stratum functionale (wird abgestoßen!)</text>

  <!-- Spiralarterien (coiled vessels) -->
  <path d="M110 146 Q100 165 118 180 Q102 195 120 215 Q105 230 115 250" class="vessel"/>
  <path d="M220 146 Q210 165 228 180 Q212 195 230 215 Q215 230 225 250" class="vessel"/>
  <circle cx="115" cy="250" r="5" class="blood"/>
  <circle cx="225" cy="250" r="5" class="blood"/>

  <text x="36" y="296" class="minor">• Progesteronabfall führt zu Ischämie (Gefäßkrampf)</text>
  <text x="36" y="314" class="minor">• Spiralarterien platzen auf → Einblutung &amp; Gewebeablösung</text>
  <text x="36" y="332" class="minor">• Basalschicht bleibt erhalten und baut neuen Zyklus auf</text>

  <!-- Panel 2: Blutungsarten & Koagel-Kriterien -->
  <rect x="380" y="52" width="340" height="295" rx="16" fill="#fff2f7" stroke="#e2c6d5" stroke-width="1.5"/>
  <text x="394" y="78" class="sub">2. Blutungsarten &amp; Koagel-Beurteilung</text>

  <!-- Normal fluid blood -->
  <rect x="394" y="94" width="312" height="60" rx="10" fill="#fff" stroke="#d9b2c5" stroke-width="1.5"/>
  <circle cx="420" cy="124" r="14" fill="#c9183b"/>
  <text x="444" y="117" font-weight="bold">Physiologisch flüssig (Plasmin-Aktivität)</text>
  <text x="444" y="136" class="minor">Enzymatische Fibrinolyse verhindert Gerinnung.</text>

  <!-- Normal small clots -->
  <rect x="394" y="162" width="312" height="60" rx="10" fill="#fff" stroke="#d9b2c5" stroke-width="1.5"/>
  <ellipse cx="420" cy="192" rx="14" ry="9" fill="#751327"/>
  <text x="444" y="184" font-weight="bold">Kleine Koagel (&lt; 2 cm / 2-Euro-Münze)</text>
  <text x="444" y="203" class="minor">Morgens nach Liegen normal (gesammeltes Blut).</text>

  <!-- Heavy clots warning -->
  <rect x="394" y="230" width="312" height="66" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
  <ellipse cx="420" cy="263" rx="18" ry="12" fill="#520b19"/>
  <text x="444" y="252" font-weight="bold" fill="#991b1b">Große Koagel (&gt; 2–3 cm) / Menorrhagie</text>
  <text x="444" y="271" class="minor" fill="#7f1d1d">Blutfluss überfordert Plasmin-Kapazität!</text>
  <text x="444" y="287" class="minor" fill="#7f1d1d">Hinweis auf Myome, Polypen oder Gerinnungsstörung.</text>

  <text x="24" y="372" class="minor">Hebammen-Regel: Bei Blutverlust &gt; 80 ml pro Zyklus oder Wechsel von Binden/Tampons alle 1–2 Stunden liegt eine Hypermenorrhoe vor.</text>
</svg>