  <line x1="168" y1="173" x2="168" y2="217" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
  
  <text x="210" y="130" font-weight="bold">Abnahme:</text>
  <text x="210" y="148" class="minor">• Am Scheideneingang</text>
  <text x="210" y="164" class="minor">• Oder direkt am Muttermund</text>
  <text x="210" y="194" font-weight="bold">Testung:</text>
  <text x="210" y="212" class="minor">• Zwischen Daumen &amp;</text>
  <text x="210" y="228" class="minor">  Zeigefinger langsam spreizen</text>
  <text x="210" y="244" class="minor">• Reißt er sofort? Oder</text>
  <text x="210" y="260" class="minor">  zieht er lange Fäden (&gt; 2 cm)?</text>

