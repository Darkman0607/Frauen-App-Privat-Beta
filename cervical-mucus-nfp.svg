  <text x="36" y="76" class="sub">1. Die Fingerprobe ("Spinnbarkeit")</text>
  
  <!-- Fingers apart -->
  <!-- Top finger -->
  <path d="M80 120 Q120 120 160 140 Q180 150 180 165 Q180 180 160 175 L80 160 Z" class="finger"/>
  <!-- Bottom finger -->
  <path d="M80 270 Q120 270 160 250 Q180 240 180 225 Q180 210 160 215 L80 230 Z" class="finger"/>
