  <rect x="380" y="50" width="340" height="290" rx="16" fill="#f4f8fa" stroke="#b5d3e3" stroke-width="1.5"/>
  <text x="396" y="76" class="sub">2. NFP-Kategorien (Sensiplan)</text>
  
  <!-- t / nothing -->
